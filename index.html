<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TS Template — Приклад</title>
    <link rel="stylesheet" href="./public/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>TypeScript Demo</h1>
      <button id="openModalBtn" class="btn">Відкрити модал</button>
    </header>

    <main class="container">
      <section class="cards" id="cards"></section>

      <section class="actions">
        <button id="loadBtn" class="btn">Завантажити пости (fetch)</button>
      </section>

      <div id="backToTop" class="back-to-top">↑</div>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-hidden="true">
      <div class="modal-content">
        <button id="closeModalBtn" class="close-btn">×</button>
        <h2>Модальне вікно</h2>
        <p id="modalText">Тут динамічний текст.</p>
      </div>
    </div>

    <script src="../ts-1/dist/main.js" defer></script>
  </body>
</html>
